# --- Markdown task files ---
- name: markdown without frontmatter
  format: markdown
  input: "# Just a note\n"
  issues: [[]]
- name: markdown with unclosed frontmatter
  format: markdown
  input: "---\ntask:\n  id: a\n"
  issues: [[]]
- name: markdown task is a string
  format: markdown
  input: "---\ntask: buy milk\n---\n"
  issues: [[task]]
- name: markdown notes in frontmatter
  format: markdown
  input: "---\ntask: { id: a, title: A, notes: x, updatedAt: 2026-11-09T10:00:00Z }\n---\n"
  issues: [[task, notes]]
- name: markdown task without id
  format: markdown
