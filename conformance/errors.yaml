  input: "BEGIN:VCALENDAR\nBEGIN:VTODO\nUID:a\nRELATED-TO:elsewhere\nEND:VTODO\nEND:VCALENDAR\n"
  dropped: [[a, RELATED-TO]]
- name: ics duplicate UID
  format: ics
  input: "BEGIN:VCALENDAR\nBEGIN:VTODO\nUID:a\nEND:VTODO\nBEGIN:VTODO\nUID:a\nEND:VTODO\nEND:VCALENDAR\n"
  dropped: [[a]]
