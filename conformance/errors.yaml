# --- References ---
- name: duplicate task id
  format: yaml
  input: |
    version: "1.0"
    tasks:
      - { id: a, title: A, updatedAt: 2026-11-09T10:00:00Z }
      - { id: a, title: B, updatedAt: 2026-11-09T10:00:00Z }
  issues: [[tasks, 1, id]]
- name: unknown list
  format: yaml
  input: |
    version: "1.0"
    tasks: [{ id: a, title: A, listId: nope, updatedAt: 2026-11-09T10:00:00Z }]
  issues: [[tasks, 0, listId]]
- name: unknown parent
  format: yaml
  input: |
    version: "1.0"
    tasks: [{ id: a, title: A, parentId: nope, updatedAt: 2026-11-09T10:00:00Z }]
  issues: [[tasks, 0, parentId]]
- name: unknown dependency
  format: yaml
  input: |
    version: "1.0"
    tasks: [{ id: a, title: A, dependsOn: [nope], updatedAt: 2026-11-09T10:00:00Z }]
  issues: [[tasks, 0, dependsOn, 0]]
- name: depends on itself
  format: yaml
  input: |
    version: "1.0"
    tasks: [{ id: a, title: A, dependsOn: [a], updatedAt: 2026-11-09T10:00:00Z }]
  issues: [[tasks, 0, dependsOn]]
- name: parent cycle
  format: yaml
  input: |
    version: "1.0"
    tasks:
      - { id: a, title: A, parentId: b, updatedAt: 2026-11-09T10:00:00Z }
      - { id: b, title: B, parentId: a, updatedAt: 2026-11-09T10:00:00Z }
  issues: [[tasks, 0, parentId]]
- name: list cycle
  format: yaml
  input: |
    version: "1.0"
    lists:
      - { id: x, title: X, parentId: y, updatedAt: 2026-11-09T10:00:00Z }
      - { id: y, title: Y, parentId: x, updatedAt: 2026-11-09T10:00:00Z }
    tasks: []
  issues: [[lists, 0, parentId]]
- name: bad list color
  format: yaml
  input: |
    version: "1.0"
    lists: [{ id: x, title: X, color: red, updatedAt: 2026-11-09T10:00:00Z }]
    tasks: []
  issues: [[lists, 0, color]]

