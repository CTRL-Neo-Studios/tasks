- name: natural-language date
  format: yaml
  input: |
    version: "1.0"
    tasks: [{ id: a, title: A, due: tomorrow, updatedAt: 2026-11-09T10:00:00Z }]
  issues: [[tasks, 0, due]]
- name: duration in months
  format: yaml
  input: |
    version: "1.0"
    tasks: [{ id: a, title: A, start: 2026-11-10, duration: P1M, updatedAt: 2026-11-09T10:00:00Z }]
