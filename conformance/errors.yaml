# Deliberately broken inputs. Shared by every implementation (TypeScript today, Rust next).
#
# Each case: `name`, `format` (json | yaml | toml | markdown | ics), `input` text, and one of:
#   issues:  reading throws, reporting exactly these paths (any order). [] is the document root.
#   dropped: (ics only) import succeeds but reports exactly these dropped paths.
# Messages are deliberately not compared: wording is per implementation, paths are the contract.
# Shape errors are reported before cross-field rules run, so each case breaks one thing.

# --- Syntax ---
- name: json trailing comma
  format: json
  input: '{"version":"1.0","tasks":[],}'
  issues: [[]]
- name: json empty input
  format: json
  input: ""
  issues: [[]]
- name: json single quotes
  format: json
  input: "{'version':'1.0','tasks':[]}"
  issues: [[]]
- name: yaml unclosed flow sequence
  format: yaml
  input: |
    version: "1.0"
    tasks: [
  issues: [[]]
- name: yaml tab indentation
  format: yaml
  input: "version: \"1.0\"\ntasks:\n\t- { id: a, title: A, updatedAt: 2026-11-09T10:00:00Z }\n"
  issues: [[]]
- name: yaml duplicate key
  format: yaml
  input: |
    version: "1.0"
    version: "1.1"
    tasks: []
  issues: [[]]
- name: yaml two documents
  format: yaml
  input: |
    version: "1.0"
    tasks: []
    ---
    version: "1.0"
    tasks: []
  issues: [[]]
- name: toml duplicate table
  format: toml
  input: |
    version = "1.0"
    tasks = []
    [x-app]
    a = 1
    [x-app]
    b = 2
  issues: [[]]
- name: toml unterminated string
  format: toml
  input: |
    version = "1.0
    tasks = []
  issues: [[]]
- name: toml integer too large to keep exactly
  format: toml
  input: |
    version = "1.0"
    tasks = []
    big = 9007199254740993
  issues: [[]]

# --- Document root ---
- name: root is a list
  format: json
  input: "[]"
  issues: [[]]
- name: root is a string
  format: yaml
  input: hello
  issues: [[]]
- name: empty yaml document
  format: yaml
  input: ""
  issues: [[]]
- name: missing version
  format: yaml
  input: "tasks: []"
  issues: [[version]]
- name: future major version
  format: yaml
  input: |
    version: "2.0"
    tasks: []
  issues: [[version]]
- name: version as a number (unquoted yaml)
  format: yaml
  input: |
    version: 1.0
    tasks: []
  issues: [[version]]
- name: version as a number (toml float)
  format: toml
  input: |
    version = 1.0
    tasks = []
  issues: [[version]]
- name: missing tasks
  format: yaml
  input: 'version: "1.0"'
  issues: [[tasks]]
- name: tasks is a map
  format: yaml
  input: |
    version: "1.0"
    tasks: { a: 1 }
  issues: [[tasks]]

# --- Task shape ---
- name: task without id
  format: yaml
  input: |
    version: "1.0"
    tasks: [{ title: A, updatedAt: 2026-11-09T10:00:00Z }]
  issues: [[tasks, 0, id]]
- name: empty id
  format: yaml
  input: |
    version: "1.0"
    tasks: [{ id: "", title: A, updatedAt: 2026-11-09T10:00:00Z }]
  issues: [[tasks, 0, id]]
- name: numeric id
  format: yaml
  input: |
    version: "1.0"
    tasks: [{ id: 42, title: A, updatedAt: 2026-11-09T10:00:00Z }]
  issues: [[tasks, 0, id]]
- name: task without title
  format: yaml
  input: |
    version: "1.0"
    tasks: [{ id: a, updatedAt: 2026-11-09T10:00:00Z }]
